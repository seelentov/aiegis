name: Bug report
description: Something in aiegis does not work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: aiegis version
      placeholder: "0.8.1"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS, Windows, Linux, Linux service]
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [claude, pi, not related]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant part of the app or run log (see docs/data-and-logs.md). Remove anything private first.
      render: text
