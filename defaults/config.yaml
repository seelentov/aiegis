# aiegis global defaults (~/.aiegis/config.yaml).
# Copied here on first start; edit freely. Project overrides live in <repo>/.aiegis/config.yaml.
#
# Cascade: global -> project -> role -> module -> matrix/standard -> item.
# Project config may add levels `modules.<name>`, `matrices.<name>` and `requirements.<key>`.
# Level fields: model, effort, instructions, permissions, env.
#   model, effort         - lower level replaces;
#   instructions          - concatenated top-down; `mode: replace` drops everything above;
#   permissions.allow/deny - union, deny wins;
#   env                   - merged, lower level wins per key.
# Instruction files are resolved relative to the directory of the config file that names them.

model: sonnet
effort: low
permissions:
  allow: []
  deny: []
env: {}

claude:
  binary: claude
  # Extra args for background (`-p`) runs. Empty --setting-sources isolates runs from user hooks/plugins.
  background_args: ["--strict-mcp-config", "--setting-sources", "", "--permission-mode", "dontAsk"]
  # Extra args for interactive sessions (free session, resume).
  interactive_args: []

queue:
  parallelism: 2
  # Pause used when a rate limit is hit but the reset time is unknown.
  rate_limit_fallback_pause_sec: 900

limits:
  # Background run is stopped when input + cache_creation + output tokens exceed this value.
  max_tokens_per_run: 300000

terminal:
  # macOS application used by "open in external terminal".
  external_app: Terminal

sessions:
  # Role of "Новая сессия" / "Открыть сессию для фикса".
  free_role: assistant
  # Role preselected for ad-hoc background tasks.
  default_task_role: task

matrix:
  # Max cells (requirements of one module and group) in one verdict session.
  batch_size: 6
  # Max cells in one n/a triage session (one module).
  triage_batch_size: 40
  # Dry-run estimate: average billable tokens per cell over this many recent successful runs of the role...
  estimate_history_runs: 20
  # ...or these values when there is no history yet.
  estimate_tokens_per_cell:
    triage: 2000
    verdicts: 30000

findings:
  # Max candidates returned by find_similar.
  similar_limit: 5

# Background tasks the app starts itself. `prompt` is a template file (relative to this config's directory);
# {{placeholders}} are filled by the app, an unknown placeholder is a configuration error.
tasks:
  # Module markup of the repository. Placeholders: project, hint, modules.
  modules:
    role: modules
    title: Разметка модулей
    prompt: instructions/tasks/modules.md
  # Entry point map of one module. Placeholders: project, module_id, module_name, module_globs, module_description.
  entry_points:
    role: entry-points
    title: "Точки входа: {{module_name}}"
    prompt: instructions/tasks/entry-points.md
  # Requirement extraction from one document version.
  # Placeholders: project, document_title, version_id, version_n, file, format, previous.
  requirements:
    role: requirements
    title: "Требования: {{document_title}} v{{version_n}}"
    prompt: instructions/tasks/requirements.md
  # Cheap n/a triage of a module against matrix requirements.
  # Placeholders: project, matrix, module_id, module_name, module_globs, module_description, requirements.
  matrix_triage:
    role: matrix-triage
    title: "Отсев n/a: {{matrix}} × {{module_name}}"
    prompt: instructions/tasks/matrix-triage.md
  # Verdicts for a batch of cells (one module, one requirement group).
  # Placeholders: project, matrix, module_id, module_name, module_globs, module_description, group, requirements.
  matrix_verdicts:
    role: matrix
    title: "Вердикты: {{matrix}} × {{module_name}} / {{group}}"
    prompt: instructions/tasks/matrix-verdicts.md
  # "Открыть сессию для фикса" (interactive, user's working directory).
  # Placeholders: project, finding_id, title, severity, cwe, description, files, recommendation, cells.
  fix:
    role: assistant
    title: "Фикс: {{title}}"
    prompt: instructions/tasks/fix.md

roles:
  # Free interactive session ("Новая сессия", "Открыть сессию для фикса").
  assistant:
    title: AppSec-ассистент
    kind: interactive
    mcp_access: manage
    model: sonnet
    effort: medium
    instructions:
      file: instructions/roles/assistant.md
    permissions:
      allow: ["mcp__aiegis"]

  # Ad-hoc background task started from the queue UI or by the assistant via MCP.
  task:
    title: Фоновая задача
    kind: background
    mcp_access: scoped
    model: haiku
    effort: low
    instructions:
      file: instructions/roles/task.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis", "Bash(git log:*)", "Bash(git show:*)", "Bash(git diff:*)"]
      deny: ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]

  requirements:
    title: Извлечение требований
    kind: background
    mcp_access: scoped
    model: haiku
    effort: low
    instructions:
      file: instructions/roles/requirements.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis"]
      deny: ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch", "Bash"]

  matrix-triage:
    title: Отсев n/a
    kind: background
    mcp_access: scoped
    model: haiku
    effort: low
    instructions:
      file: instructions/roles/matrix-triage.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis", "Bash(git ls-files:*)"]
      deny: ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]

  matrix:
    title: Проверка матрицы
    kind: background
    mcp_access: scoped
    model: sonnet
    effort: low
    instructions:
      file: instructions/roles/matrix.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis", "Bash(git log:*)", "Bash(git show:*)", "Bash(git diff:*)"]
      deny: ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]

  sca:
    title: SCA
    kind: background
    mcp_access: scoped
    model: haiku
    effort: low
    instructions:
      file: instructions/roles/sca.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis", "Bash(git log:*)", "Bash(git show:*)", "Bash(git diff:*)"]
      deny: ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]

  modules:
    title: Разметка модулей
    kind: background
    mcp_access: scoped
    model: sonnet
    effort: low
    instructions:
      file: instructions/roles/modules.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis", "Bash(git log:*)", "Bash(git show:*)", "Bash(git diff:*)", "Bash(git ls-files:*)"]
      deny: ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]

  entry-points:
    title: Карта точек входа
    kind: background
    mcp_access: scoped
    model: sonnet
    effort: low
    instructions:
      file: instructions/roles/entry-points.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis", "Bash(git log:*)", "Bash(git show:*)", "Bash(git diff:*)"]
      deny: ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]

  tester:
    title: PoC-тестировщик
    kind: background
    mcp_access: scoped
    model: sonnet
    effort: low
    instructions:
      file: instructions/roles/tester.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis", "Bash(git log:*)", "Bash(git show:*)", "Bash(git diff:*)", "Bash(curl:*)"]
      deny: ["Edit", "NotebookEdit", "WebFetch", "WebSearch"]
