# aiegis global defaults (~/.aiegis/config.yaml).
# Copied here on first start; edit freely. Project overrides live in <repo>/.aiegis/config.yaml.
#
# Cascade: global -> project -> role -> module -> matrix/standard -> item.
# Project config may add levels `modules.<name>`, `matrices.<name>` and `requirements.<key>`.
# Level fields: model, effort, instructions, permissions, env.
#   model, effort         - lower level replaces;
#   instructions          - concatenated top-down; `mode: replace` drops everything above;
#   permissions.allow/deny - union, deny wins;
#   env                   - merged, lower level wins per key.
# Instruction files are resolved relative to the directory of the config file that names them.

model: sonnet
effort: low
permissions:
  allow: []
  deny: []
env: {}

claude:
  binary: claude
  # Extra args for background (`-p`) runs. Empty --setting-sources isolates runs from user hooks/plugins.
  background_args: ["--strict-mcp-config", "--setting-sources", "", "--permission-mode", "dontAsk"]
  # Extra args for interactive sessions (free session, resume).
  interactive_args: []

queue:
  parallelism: 2
  # Pause used when a rate limit is hit but the reset time is unknown.
  rate_limit_fallback_pause_sec: 900

limits:
  # Background run is stopped when input + cache_creation + output tokens exceed this value.
  max_tokens_per_run: 300000

terminal:
  # macOS application used by "open in external terminal".
  external_app: Terminal

sessions:
  # Role of "Новая сессия" / "Открыть сессию для фикса".
  free_role: assistant
  # Role preselected for ad-hoc background tasks.
  default_task_role: task

matrix:
  # Max cells (requirements of one module and group) in one verdict session.
  batch_size: 6
  # Max cells in one n/a triage session (one module).
  triage_batch_size: 40
  # Dry-run estimate: average billable tokens per cell over this many recent successful runs of the role...
  estimate_history_runs: 20
  # ...or these values when there is no history yet.
  estimate_tokens_per_cell:
    triage: 2000
    verdicts: 30000

findings:
  # Max candidates returned by find_similar.
  similar_limit: 5

# Scanners the app runs itself, once per commit in the worktree (results are cached by commit and scanned paths).
# Binaries come from the system (PATH); availability is checked at startup with `version_args`.
#   format         - normalizer of the output: semgrep | gitleaks | trivy;
#   args           - command line; placeholders (whole arguments only):
#                    {{targets}} - all scanned paths (several arguments), {{target}} - one path (one run per path),
#                    {{report}}  - file the scanner writes its report to (otherwise stdout is parsed);
#   ok_exit_codes  - exit codes that mean "scan completed";
#   timeout_sec    - one invocation is killed after this time.
# Paths are relative to the worktree root; `.aiegis/...` rule files committed to the repository work as --config.
scanners:
  semgrep:
    enabled: true
    binary: semgrep
    format: semgrep
    version_args: ["--version"]
    args: ["scan", "--config", "p/default", "--json", "--quiet", "--metrics", "off", "--disable-version-check", "{{targets}}"]
    ok_exit_codes: [0, 1]
    timeout_sec: 1800
  gitleaks:
    enabled: true
    binary: gitleaks
    format: gitleaks
    version_args: ["version"]
    args: ["dir", "--report-format", "json", "--report-path", "{{report}}", "--no-banner", "--log-level", "error", "--exit-code", "0", "{{target}}"]
    ok_exit_codes: [0]
    timeout_sec: 900
  trivy:
    enabled: true
    binary: trivy
    format: trivy
    version_args: ["--version"]
    # vuln = dependency CVEs (stored for SCA), secret and misconfig = signals.
    args: ["fs", "--format", "json", "--output", "{{report}}", "--scanners", "vuln,secret,misconfig", "--quiet", "{{target}}"]
    ok_exit_codes: [0]
    timeout_sec: 1800

signals:
  # Queue missing scans of the batch's modules (at the job's commit) before matrix verdict sessions;
  # those sessions wait in the queue until the scans finish.
  auto_scan: true
  # Max signals one get_signals call returns (the rest is reported as truncated).
  max_per_call: 40
  # Signal kinds get_signals does not return: dependency CVEs (vuln) are handled by SCA.
  exclude_kinds: [vuln]
  # Optional relevance of signals to requirements, by requirement key (usually set in the project config):
  #   requirements: { AC-2: { kinds: [sast], cwe: [CWE-639, CWE-284], rules: ["idor|authz"] } }
  # `rules` are regular expressions over rule ids. Without an entry the agent filters signals itself.
  requirements: {}

suppressions:
  # Max relevant suppressions mixed into a matrix verdict prompt as few-shot examples.
  few_shot_limit: 5
  # Whether suppressions made stale by code changes (SPEC §5) still filter signals; false = stale ones are shown
  # to the agent with their reason until a human confirms them again.
  apply_stale: false

sca:
  # Dry-run estimate of a reachability run: average billable tokens per session (one module x package) over this many
  # recent successful runs of the role...
  estimate_history_runs: 20
  # ...or this value when there is no history yet.
  estimate_tokens_per_package: 25000
  # Max dependency CVEs from scanner scans (trivy `vuln` signals) listed in the inventory prompt as hints.
  scanner_hints_limit: 60
  # Prefilter (no AI): module files larger than this are not searched for imports of a package.
  prefilter_max_file_kb: 1024
  # Tool reports larger than this are rejected (the inventory agent must narrow the scan).
  report_max_mb: 50

# Background tasks the app starts itself. `prompt` is a template file (relative to this config's directory);
# {{placeholders}} are filled by the app, an unknown placeholder is a configuration error.
tasks:
  # Module markup of the repository. Placeholders: project, hint, modules.
  modules:
    role: modules
    title: Разметка модулей
    prompt: instructions/tasks/modules.md
  # Entry point map of one module. Placeholders: project, module_id, module_name, module_globs, module_description.
  entry_points:
    role: entry-points
    title: "Точки входа: {{module_name}}"
    prompt: instructions/tasks/entry-points.md
  # Requirement extraction from one document version.
  # Placeholders: project, document_title, version_id, version_n, file, format, previous.
  requirements:
    role: requirements
    title: "Требования: {{document_title}} v{{version_n}}"
    prompt: instructions/tasks/requirements.md
  # Cheap n/a triage of a module against matrix requirements.
  # Placeholders: project, matrix, module_id, module_name, module_globs, module_description, requirements.
  matrix_triage:
    role: matrix-triage
    title: "Отсев n/a: {{matrix}} × {{module_name}}"
    prompt: instructions/tasks/matrix-triage.md
  # Verdicts for a batch of cells (one module, one requirement group).
  # Placeholders: project, matrix, module_id, module_name, module_globs, module_description, group, requirements,
  # suppressions (relevant human suppressions of scanner signals, few-shot).
  matrix_verdicts:
    role: matrix
    title: "Вердикты: {{matrix}} × {{module_name}} / {{group}}"
    prompt: instructions/tasks/matrix-verdicts.md
  # Dependency inventory of one module: the agent picks the tools to resolve dependencies and look up vulnerabilities.
  # Runs in a separate worktree of the commit (build tools write there). Placeholders: project, module_id, module_name,
  # module_globs, module_description, out_dir (the run's directory inside the checkout), inputs (files uploaded by
  # humans, copied into out_dir), scanner_hints (dependency CVEs found by configured scanners).
  sca_inventory:
    role: sca-inventory
    title: "SCA-инвентаризация: {{module_name}}"
    prompt: instructions/tasks/sca-inventory.md
  # Reachability of the vulnerabilities of one package in one module.
  # Placeholders: project, module_id, module_name, module_globs, module_description, package_key, package, direct,
  # manifest, import_names, import_hits (module files that refer to the package), vulnerabilities.
  sca_reachability:
    role: sca
    title: "SCA: {{module_name}} × {{package}}"
    prompt: instructions/tasks/sca-reachability.md
  # "Открыть сессию для фикса" (interactive, user's working directory).
  # Placeholders: project, finding_id, title, severity, cwe, description, files, recommendation, cells.
  fix:
    role: assistant
    title: "Фикс: {{title}}"
    prompt: instructions/tasks/fix.md

roles:
  # Free interactive session ("Новая сессия", "Открыть сессию для фикса").
  assistant:
    title: AppSec-ассистент
    kind: interactive
    mcp_access: manage
    model: sonnet
    effort: medium
    instructions:
      file: instructions/roles/assistant.md
    permissions:
      allow: ["mcp__aiegis"]

  # Ad-hoc background task started from the queue UI or by the assistant via MCP.
  task:
    title: Фоновая задача
    kind: background
    mcp_access: scoped
    model: haiku
    effort: low
    instructions:
      file: instructions/roles/task.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis", "Bash(git log:*)", "Bash(git show:*)", "Bash(git diff:*)"]
      deny: ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]

  requirements:
    title: Извлечение требований
    kind: background
    mcp_access: scoped
    model: haiku
    effort: low
    instructions:
      file: instructions/roles/requirements.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis"]
      deny: ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch", "Bash"]

  matrix-triage:
    title: Отсев n/a
    kind: background
    mcp_access: scoped
    model: haiku
    effort: low
    instructions:
      file: instructions/roles/matrix-triage.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis", "Bash(git ls-files:*)"]
      deny: ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]

  matrix:
    title: Проверка матрицы
    kind: background
    mcp_access: scoped
    model: sonnet
    effort: low
    # Methodology fragments are adapted from cloudflare/security-audit-skill (MIT), see instructions/methodology/README.md.
    instructions:
      file:
        - instructions/roles/matrix.md
        - instructions/methodology/verdict-discipline.md
        - instructions/methodology/attack-classes.md
        # For modules with HTTP/auth, add in the project config: instructions/methodology/web-and-auth.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis", "Bash(git log:*)", "Bash(git show:*)", "Bash(git diff:*)"]
      deny: ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]

  # SCA reachability: is a vulnerable package version used by the module in a way the vulnerability needs.
  sca:
    title: SCA — достижимость
    kind: background
    mcp_access: scoped
    model: haiku
    effort: low
    instructions:
      file: instructions/roles/sca.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis", "Bash(git log:*)", "Bash(git show:*)", "Bash(git diff:*)"]
      deny: ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]

  # SCA inventory: resolves dependencies and looks up their vulnerabilities with tools it picks itself.
  # Build tools run the project's build scripts in a separate worktree (trust in the audited repository);
  # files may be written only into the run's directory `.aiegis-sca/` of that worktree. Extend the allowlist per project.
  sca-inventory:
    title: SCA — инвентаризация
    kind: background
    mcp_access: scoped
    model: haiku
    effort: low
    instructions:
      file: instructions/roles/sca-inventory.md
    permissions:
      allow:
        - Read
        - Grep
        - Glob
        - mcp__aiegis
        - Edit(./.aiegis-sca/**)
        - Write(./.aiegis-sca/**)
        - Bash(git log:*)
        - Bash(git ls-files:*)
        - Bash(ls:*)
        - Bash(mkdir:*)
        - Bash(which:*)
        - Bash(./gradlew:*)
        - Bash(gradle:*)
        - Bash(./mvnw:*)
        - Bash(mvn:*)
        - Bash(npm ls:*)
        - Bash(npm audit:*)
        - Bash(yarn audit:*)
        - Bash(pnpm audit:*)
        - Bash(pip-audit:*)
        - Bash(go list:*)
        - Bash(govulncheck:*)
        - Bash(cargo audit:*)
        - Bash(trivy:*)
        - Bash(osv-scanner:*)
        - Bash(grype:*)
        - Bash(syft:*)
        - Bash(unzip -l:*)
        - Bash(jar tf:*)
      deny: ["NotebookEdit", "WebFetch", "WebSearch"]
      # Package caches outside the worktree (jar listings for import names).
      dirs: ["~/.gradle/caches", "~/.m2/repository"]

  modules:
    title: Разметка модулей
    kind: background
    mcp_access: scoped
    model: sonnet
    effort: low
    instructions:
      file: instructions/roles/modules.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis", "Bash(git log:*)", "Bash(git show:*)", "Bash(git diff:*)", "Bash(git ls-files:*)"]
      deny: ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]

  entry-points:
    title: Карта точек входа
    kind: background
    mcp_access: scoped
    model: sonnet
    effort: low
    instructions:
      file: instructions/roles/entry-points.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis", "Bash(git log:*)", "Bash(git show:*)", "Bash(git diff:*)"]
      deny: ["Edit", "Write", "NotebookEdit", "WebFetch", "WebSearch"]

  tester:
    title: PoC-тестировщик
    kind: background
    mcp_access: scoped
    model: sonnet
    effort: low
    instructions:
      file: instructions/roles/tester.md
    permissions:
      allow: ["Read", "Grep", "Glob", "mcp__aiegis", "Bash(git log:*)", "Bash(git show:*)", "Bash(git diff:*)", "Bash(curl:*)"]
      deny: ["Edit", "NotebookEdit", "WebFetch", "WebSearch"]
